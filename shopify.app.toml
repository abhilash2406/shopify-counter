# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "ca430d4f5ce19f25db40c405dd6837c6"
name = "countdown-timer-app"
application_url = "https://example.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_products: needed to resolve product/collection titles for the
# targeting picker's edit view (Admin GraphQL). No write scope is needed —
# this app never creates or modifies products.
scopes = "read_products"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[app_proxy]
url = "https://example.com/api/public"
subpath = "countdown-timer"
prefix = "apps"

[webhooks]
api_version = "2026-10"

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
